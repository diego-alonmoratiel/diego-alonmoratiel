<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Diego Alonso Moratiel — Telecom Engineer, Cloud and Platform, AI Infrastructure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="22" fill="url(#glow)"/>
  <rect width="1000" height="260" rx="22" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="259" rx="21.5" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>

  <!-- network motif: left -->
  <g stroke="#38bdf8" stroke-opacity="0.30" stroke-width="1.2">
    <path d="M70 60 L130 92 L108 158 L46 140 Z" fill="none"/>
    <path d="M130 92 L196 70 M108 158 L164 196 M46 140 L80 206" fill="none"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="70" cy="60" r="3.5" fill-opacity="0.85"/>
    <circle cx="130" cy="92" r="2.5" fill-opacity="0.6"/>
    <circle cx="108" cy="158" r="3" fill-opacity="0.75"/>
    <circle cx="46" cy="140" r="2" fill-opacity="0.5"/>
    <circle cx="196" cy="70" r="2" fill-opacity="0.45"/>
    <circle cx="164" cy="196" r="2.5" fill-opacity="0.55"/>
    <circle cx="80" cy="206" r="2" fill-opacity="0.4"/>
  </g>

  <!-- network motif: right -->
  <g stroke="#34d399" stroke-opacity="0.28" stroke-width="1.2">
    <path d="M930 62 L872 96 L898 162 L954 138 Z" fill="none"/>
    <path d="M872 96 L808 74 M898 162 L842 198 M954 138 L920 208" fill="none"/>
  </g>
  <g fill="#34d399">
    <circle cx="930" cy="62" r="3" fill-opacity="0.8"/>
    <circle cx="872" cy="96" r="2.5" fill-opacity="0.55"/>
    <circle cx="898" cy="162" r="3" fill-opacity="0.7"/>
    <circle cx="954" cy="138" r="2" fill-opacity="0.45"/>
    <circle cx="808" cy="74" r="2" fill-opacity="0.4"/>
    <circle cx="842" cy="198" r="2.5" fill-opacity="0.5"/>
    <circle cx="920" cy="208" r="2" fill-opacity="0.35"/>
  </g>

  <!-- text -->
  <g text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="500" y="86" fill="#7dd3fc" font-size="14" font-weight="600" letter-spacing="5.5">TELECOM ENGINEER</text>
    <text x="500" y="142" fill="#f8fafc" font-size="48" font-weight="700" letter-spacing="-0.5">Diego Alonso Moratiel</text>
    <text x="500" y="178" fill="#94a3b8" font-size="18" font-weight="400">Cloud &amp; Platform Engineering · AI Infrastructure</text>
    <rect x="430" y="200" width="140" height="2.5" rx="1.25" fill="url(#accent)"/>
    <text x="500" y="232" fill="#64748b" font-size="13" font-weight="500" letter-spacing="2.6">K3S · TERRAFORM · AWS · EDGE LLMs · OBSERVABILITY</text>
  </g>
</svg>
